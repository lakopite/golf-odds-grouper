<!doctype html>
<!--
  Reference scoreboard template.

  The bundler (bundle_frontend.py) inlines style.css and app.js, substitutes the
  {{token}}s below, and replaces the marker in the data script with the result JSON.
  The result is one self-contained file that opens from disk.

  A designed replacement only has to keep four things:
    * the <script id="competition-data"> element with the marker inside it
    * local asset references the bundler can inline
    * whatever {{tokens}} it wants filled
    * the <script id="league-art"> element, if it draws the league's art at all --
      the bundler fills it with the two images the result file's slug names
  See docs/FRONTEND-SPEC.md, and frontend/scoreboard/ for the designed page this
  repository actually ships. `lib.js` sits above both templates, at ../lib.js, so the
  standings rule exists once and the parity test covers every page built from it.
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{league_name}} — {{tournament}}</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<main>
  <header class="page">
    <!-- No src: app.js fills these from the league-art element below, or leaves them
         hidden. A league with no art gets a header with its name in it, and that is a
         finished header. -->
    <img id="league-banner" class="banner" alt="" hidden>
    <img id="league-logo" alt="" width="48" height="48" hidden>
    <h1><span id="league-name">{{league_name}}</span></h1>
    <p class="sub"><span id="tournament">{{tournament}}</span> · <span id="market">{{market}}</span></p>
    <p class="sub" id="round"></p>
    <p class="sub small" id="built"></p>
  </header>

  <!-- "Standings" on a live page, "Groups" on one built before the field existed.
       app.js sets it; the markup carries the live wording as its default. -->
  <h2 id="standings-heading">Standings</h2>
  <section id="standings"></section>

  <h2>Odds</h2>
  <p class="muted small" id="odds-note"></p>

  <footer>
    <p id="sources"></p>
    <p id="poll"></p>
    <p>competition {{competition_id}}</p>
  </footer>
</main>

<script id="competition-data" type="application/json">/*__COMPETITION_JSON__*/</script>
<!-- The league's art as data: URIs, read by the bundler out of leagues/<slug>/. The
     result file names the slug and carries no images; this is where they arrive. -->
<script id="league-art" type="application/json">/*__LEAGUE_ART_JSON__*/</script>
<script src="../lib.js"></script>
<script src="app.js"></script>
</body>
</html>
